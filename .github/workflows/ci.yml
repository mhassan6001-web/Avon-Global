name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: aven_test, POSTGRES_USER: aven, POSTGRES_PASSWORD: ci_password }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aven" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://aven:ci_password@localhost:5432/aven_test
      DATABASE_URL: postgresql+psycopg://aven:ci_password@localhost:5432/aven_test
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      RUN: ../.github/scripts/run.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install
        run: $RUN install pip install -r requirements-dev.txt
      # Checks run independently (if: !cancelled()) so one run reports every failure.
      - name: Lint
        if: ${{ !cancelled() }}
        run: $RUN ruff sh -c "ruff check . && ruff format --check ."
      - name: Type check
        if: ${{ !cancelled() }}
        run: $RUN mypy mypy app
      - name: Security lint
        if: ${{ !cancelled() }}
        run: $RUN bandit bandit -q -r app
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: $RUN pip-audit pip-audit -r requirements.txt
      - name: Tests (integration tests must not be skipped)
        if: ${{ !cancelled() }}
        run: $RUN pytest sh -c 'pytest -rA > pytest.log 2>&1; s=$?; cat pytest.log; if grep -q "^SKIPPED.*integration" pytest.log; then echo "Integration tests were skipped"; exit 1; fi; exit $s'
      - name: Migration round-trip
        if: ${{ !cancelled() }}
        run: $RUN alembic sh -c "alembic downgrade base && alembic upgrade head && alembic check"
      - name: Application startup
        if: ${{ !cancelled() }}
        run: |
          $RUN startup sh -c '(uvicorn app.main:create_app --factory --port 8000 > uvicorn.log 2>&1 &) ; sleep 5; cat uvicorn.log; curl -fsS http://127.0.0.1:8000/api/v1/health/live && echo && curl -fsS http://127.0.0.1:8000/api/v1/health/ready'

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      RUN: ../.github/scripts/run.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install
        run: $RUN install npm install --no-audit --no-fund
      - name: Format
        if: ${{ !cancelled() }}
        run: $RUN prettier npm run format:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: $RUN eslint npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: $RUN tsc npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: $RUN tests npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: $RUN build npm run build
